<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>내 프로그램</title>
  <link rel="stylesheet" href="style.css?v=20260803T122253661Z" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>내 프로그램</h1>
      <p class="lead">필요한 것을 골라 바로 내려받으세요</p>
      <div class="stats">
        <div class="stat"><b id="stat-downloads">0</b> 받아간 횟수</div>
        <div class="stat"><b id="stat-count">0</b> 프로그램</div>
      </div>
    </header>
    <div class="tools">
      <input id="search" class="search" type="search" placeholder="이름으로 찾기" />
      <div id="filters" class="filters"></div>
    </div>
    <div id="list"></div>
    <details class="warn">
      <summary>처음 실행할 때 파란 창이 뜨면</summary>
      <p>"추가 정보" 를 누르고 "실행" 을 누르시면 됩니다. 프로그램에 문제가 있는 것이 아닙니다.</p>
    </details>
    <footer>Project Hub 로 만들었습니다</footer>
  </div>
  <dialog id="detail">
    <div id="detail-body"></div>
    <div class="dialog-buttons"><button id="detail-close" class="chip">닫기</button></div>
  </dialog>
  <script src="app.js?v=20260803T122253661Z"></script>
</body>
</html>
